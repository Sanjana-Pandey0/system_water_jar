<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AquaFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
    .card{border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4);border:none}
    .btn-login{background:#1a56db;color:#fff;border:none;padding:12px;font-size:1rem;font-weight:600;border-radius:10px;width:100%}
    .btn-login:hover{background:#1342a8;color:#fff}
    .form-control{border-radius:10px;padding:11px 14px;border:1.5px solid #e2e8f0}
    .form-control:focus{border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,.1)}
    .hint{background:#f0f4ff;border-radius:10px;padding:10px 14px;font-size:.8rem;color:#4b5563;border-left:3px solid #1a56db}
  </style>
</head>
<body>
<div class="card">
  <div class="text-center mb-4">
    <div style="font-size:3rem">💧</div>
    <h4 class="fw-bold mt-2 mb-0">AquaFlow</h4>
    <p class="text-muted small">Water Jar Supply Management</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 mb-3" style="border-radius:10px">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold small">Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold small">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>
    <div class="mb-4">
      <label class="d-flex align-items-center gap-2 small" style="cursor:pointer">
        <input type="checkbox" name="remember" class="form-check-input m-0"> Keep me logged in
      </label>
    </div>
    <button type="submit" class="btn-login">Sign In</button>
  </form>
  <div class="hint mt-4">
    <b>Default login:</b> Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin123</code>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
