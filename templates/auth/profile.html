{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}

{% block content %}
<div class="row g-4" style="max-width:600px;">
  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <span><i class="bi bi-person-circle me-2 text-brand"></i>Account Settings</span>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Full Name</label>
              <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name or '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ current_user.email or '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Username <small class="text-muted">(cannot change)</small></label>
              <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
            </div>
            <hr>
            <div class="col-12"><div class="form-section-title">Change Password (optional)</div></div>
            <div class="col-12">
              <label class="form-label">Current Password</label>
              <input type="password" name="current_password" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">New Password</label>
              <input type="password" name="new_password" class="form-control">
            </div>
            <div class="col-12 mt-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i> Save Changes
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
